services:
  sim:
    build:
      context: .
      dockerfile: docker/sim/Dockerfile
    image: orange-igvc-sim:humble
    network_mode: host
    ipc: host
    gpus: all
    environment:
      DISPLAY: ${DISPLAY}
      NVIDIA_DRIVER_CAPABILITIES: all
      QT_X11_NO_MITSHM: "1"
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    volumes:
      - .:/workspace
      - sim_build:/workspace/build
      - sim_install:/workspace/install
      - sim_log:/workspace/log
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: /bin/bash

volumes:
  sim_build:
  sim_install:
  sim_log:
